name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install testing tools
        run: python -m pip install pyyaml -r pet_bathroom_tracker/requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Test dashboard time formatting and HTML escaping
        run: node tests/test_dashboard.js

      - name: Compile Python and validate shell
        run: |
          python -m py_compile pet_bathroom_tracker/app.py pet_bathroom_tracker/bootstrap.py
          sh -n pet_bathroom_tracker/run.sh

      - name: Check dashboard JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('pet_bathroom_tracker/templates/index.html').read_text()
          Path('/tmp/pet-tracker-dashboard.js').write_text(source.split('<script>', 1)[1].split('</script>', 1)[0])
          PY
          node --check /tmp/pet-tracker-dashboard.js

