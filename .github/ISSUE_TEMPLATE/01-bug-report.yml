name: "Bug report"
description: "Report something that is broken in Pet Bathroom Tracker."
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Pet Bathroom Tracker! Before submitting, search for similar issues.

        **Privacy:** Do not post passwords, Home Assistant tokens, backup archives, public IP addresses, or private pet/household information. Redact sensitive values from logs and screenshots.

        For a possible security vulnerability, consult [SECURITY.md](https://github.com/MonsoonSaloon/pet-bathroom-tracker-home-assistant/blob/main/SECURITY.md) rather than opening a public bug report.
  - type: dropdown
    id: area
    attributes:
      label: Where is the problem?
      options:
        - Installation or startup
        - Home Assistant sidebar / Ingress access
        - Pet management
        - Adding, editing, or deleting trips
        - Daily timeline or totals
        - App update or update entity
        - Backup, restore, or retained data
        - Other
    validations:
      required: true
  - type: input
    id: tracker-version
    attributes:
      label: Pet Bathroom Tracker version
      description: "Shown on the app Info page or near the top of its dashboard."
      placeholder: "e.g. 0.5.4"
    validations:
      required: true
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant OS and Core versions
      placeholder: "e.g. HA OS 18.3, Core 2026.10.3"
    validations:
      required: false
  - type: dropdown
    id: architecture
    attributes:
      label: System architecture
      options:
        - AMD64 / x86-64
        - ARM64 / aarch64
        - Other
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: installation-type
    attributes:
      label: Installation state
      options:
        - Fresh installation
        - Updated from an earlier version
        - Restored from a backup
        - Existing installation (no recent changes)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: What happened?
      description: "Describe the observed behavior and any error message (with sensitive data removed)."
      placeholder: "The app shows ... when I ..."
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Pet Bathroom Tracker in Home Assistant.
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Screenshots or redacted logs (optional)
      description: "You can drag images into this field. Remove tokens, passwords, IP addresses, personal details, and any other secrets first."
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for a similar report.
          required: true
        - label: I removed secrets and personal information from any screenshots or logs I included.
          required: true
