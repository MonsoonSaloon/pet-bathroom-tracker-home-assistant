
version: 2

updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/pet_bathroom_tracker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/pet_bathroom_tracker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
